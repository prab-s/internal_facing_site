#
# Port map / network intent
# - Host port 8000 -> `app:8000` for the internal staff site + FastAPI API
# - `postgres` is also bound to 127.0.0.1:5432 for local SIT/admin access only
# - Other containers in this stack reach the FastAPI app at `http://app:8000`
#
services:
  postgres:
    image: docker.io/library/postgres:16
    container_name: fan-graphs-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    volumes:
      - fan_graphs_postgres_data:/var/lib/postgresql/data:Z
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 20

  app:
    build:
      context: .
    image: fan-graphs
    container_name: fan-graphs-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; url='http://127.0.0.1:8000/api/health/security'; opener=urllib.request.build_opener();\ntry: response=opener.open(url, timeout=3); print(response.read().decode())\nexcept urllib.error.HTTPError as error: print(error.read().decode()); raise\""]
      interval: 5s
      timeout: 5s
      retries: 20
    environment:
      DATABASE_URL: ${DATABASE_URL}
      APP_TIMEZONE: ${APP_TIMEZONE:-Pacific/Auckland}
      TZ: ${TZ:-Pacific/Auckland}
      BOOTSTRAP_ADMIN_USERNAME: ${BOOTSTRAP_ADMIN_USERNAME}
      BOOTSTRAP_ADMIN_PASSWORD: ${BOOTSTRAP_ADMIN_PASSWORD}
      SESSION_SECRET: ${SESSION_SECRET}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE}
      CMS_API_TOKEN: ${CMS_API_TOKEN}
      SMTP_HOST: ${SMTP_HOST}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
      SMTP_SECURITY: ${SMTP_SECURITY:-starttls}
      SMTP_FROM_ADDRESS: ${SMTP_FROM_ADDRESS}
      QUOTE_REQUEST_RECIPIENT_EMAILS: ${QUOTE_REQUEST_RECIPIENT_EMAILS}
      INTERNAL_FRAME_ANCESTORS: ${INTERNAL_FRAME_ANCESTORS}
      SECURITY_CONFIGURATION_FILE: ${SECURITY_CONFIGURATION_FILE:-.env.deploy}
      SECURITY_CONFIGURATION_STRICT: ${SECURITY_CONFIGURATION_STRICT:-true}
      FINDER_DEBUG: "false"
      LOG_LEVEL: INFO
      PUBLIC_CATALOGUE_SITE_URL: ${PUBLIC_CATALOGUE_SITE_URL:-https://p1.bitrep.nz}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - fan_graphs_app_data:/app/data:Z
      - fan_graphs_templates:/app/templates:Z

  customer_facing:
    profiles: ["catalogue"]
    build:
      context: ./customer_facing
      dockerfile: Containerfile
    image: vent-tech-catalogue
    container_name: vent-tech-catalogue
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "8004:8004"
    environment:
      BACKEND_API_BASE_URL: ${PUBLIC_CATALOGUE_BACKEND_API_BASE_URL:-http://app:8000}
      PUBLIC_SITE_URL: ${PUBLIC_CATALOGUE_SITE_URL:-https://p1.bitrep.nz}
      SITE_NAME: ${PUBLIC_CATALOGUE_SITE_NAME:-Vent-tech catalogue}
      REQUEST_TIMEOUT_SECONDS: ${PUBLIC_CATALOGUE_REQUEST_TIMEOUT_SECONDS:-10}
      QUOTE_REQUEST_TIMEOUT_SECONDS: ${PUBLIC_CATALOGUE_QUOTE_REQUEST_TIMEOUT_SECONDS:-60}
      LOG_LEVEL: INFO
      FINDER_DEBUG: "false"
      CATALOGUE_CACHE_PATH: ${PUBLIC_CATALOGUE_CACHE_PATH:-/tmp/vent-tech-catalogue-cache.json}
      CATALOGUE_REFRESH_INTERVAL_SECONDS: ${PUBLIC_CATALOGUE_REFRESH_INTERVAL_SECONDS:-300}
      CMS_API_TOKEN: ${CMS_API_TOKEN}
      FRAME_ANCESTORS: ${FRAME_ANCESTORS}
      SECURITY_CONFIGURATION_FILE: ${SECURITY_CONFIGURATION_FILE:-.env.deploy}
      SECURITY_CONFIGURATION_STRICT: ${SECURITY_CONFIGURATION_STRICT:-true}
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; url='http://127.0.0.1:8004/api/health/security'; opener=urllib.request.build_opener();\ntry: response=opener.open(url, timeout=3); print(response.read().decode())\nexcept urllib.error.HTTPError as error: print(error.read().decode()); raise\""]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  fan_graphs_app_data:
  fan_graphs_templates:
  fan_graphs_postgres_data:
